<!DOCTYPE html>
<html>
<head>
    <title>My Chat</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="chat-screen">

    <div class="chat-header">
        <span>←</span>
        <div class="profile"></div>
        <h3>Ko Ko</h3>
        <div class="actions">
            📞 📹
        </div>
    </div>


    <div class="messages">

        <div class="received">
            Hello 👋
        </div>

        <div class="sent">
            Hi, How are you?
        </div>

    </div>


    <div class="input-area">

        <button>😊</button>

        <input type="text" placeholder="Message">

        <button>🎤</button>

        <button>➤</button>

    </div>

</div>

</body>
</html>
